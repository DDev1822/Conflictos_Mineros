- id: madre-dios-fiscalizacion-mercurio-2025
  topic: madre-de-dios
  date: 2025-06-10
  title: Contraloría identificó una falla concreta en la fiscalización del mercurio
  summary: La auditoría encontró que la autoridad regional no fiscalizó la reducción progresiva del uso de mercurio en 119 operaciones mineras artesanales entre 2021 y 2023.
  analysis: "El hallazgo conecta salud, ambiente y capacidad estatal: 65 operaciones recibieron instrumentos de gestión ambiental sin cronogramas de implementación y se señaló responsabilidad penal en siete servidores."
  metrics:
    - { value: "119", label: "operaciones sin fiscalización efectiva" }
    - { value: "65", label: "operaciones con instrumentos incompletos" }
    - { value: "7", label: "servidores con responsabilidad señalada" }
  sourceIds: [contraloria-madre-dios-mercurio-2025]

