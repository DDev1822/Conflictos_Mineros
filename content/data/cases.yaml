      date: 2000-08-14
      datePrecision: day
      title: Convenio entre Yanacocha y la municipalidad delegada de Choropampa
      summary: El Informe Defensorial incorpora el convenio de transacción con la municipalidad delegada y reportes posteriores registran obras públicas; la controversia sanitaria y la demanda de reparación continuaron.
      sourceIds: [choropampa-defensoria-62, choropampa-newmont-10k-2002]
