  actorPositions:
    - actor: Comunidades demandantes
      position: Comunidades reclaman protección de derechos y respuesta estatal mediante una acción de amparo atribuida; CEJ verifica existencia, juzgado y partes del expediente, mientras fuentes de seguimiento reportan admisión, reprogramaciones y una primera audiencia sin sustituir actas o resoluciones.
      sourceIds: [pametec-demanda-amparo-2025, cooperaccion-espinar-2025, ocm-espinar-amparo-reprogramacion-2026, cooperaccion-espinar-amparo-audiencia-2026, cej-espinar-amparo-2026]
    - actor: Autoridades ambientales y sanitarias
