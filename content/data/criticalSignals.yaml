  title: Tambopata combinó vigilancia permanente y operativos interinstitucionales
  summary: SERNANP reportó 99 patrullajes especiales y 25 operativos durante 2024, con destrucción de 45 campamentos y más de 50 motores y otros equipos.
  analysis: El despliegue muestra capacidad operativa dentro del área protegida, pero la expansión detectada después en Yarinal revela la velocidad con la que la actividad cambia de ubicación.
