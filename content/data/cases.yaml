- id: tambogrande
  slug: tambogrande
  name: Tambogrande
  summary: Caso territorial con un ciclo histórico asociado a Manhattan/TG-1 y un conflicto contemporáneo distinto alrededor de Buenaventura/El Algarrobo-TG-3, atravesados por agricultura, agua, participación y legitimidad.
  period: { start: 1999, end: null }
  status: active
  territoryIds: [tambogrande-piura]
  actorIds: [comunidades-tambogrande, empresa-manhattan, comunidad-locuto, empresa-buenaventura, proinversion-activos-mineros, gobiernos-subnacionales]
  issueIds: [concesion-superficie, consulta-participacion, agua-cuencas, dialogo-acuerdos]
  legalInstrumentIds: [ds-014-1992-em, ley-27446]
  minerals: [oro, cobre, zinc, plata]
  timeline:
    - id: tambogrande-proyecto
      kind: event
      date: 1999-01-01
      datePrecision: year
      title: Inicio de línea base ambiental y social
      summary: Manhattan declara haber iniciado a fines de 1999 la recopilación continua de información ambiental y social para el proyecto.
      sourceIds: [manhattan-annual-report-2002]
    - id: tambogrande-consulta
      kind: decision
      date: 2002-06-02
      datePrecision: day
      title: Consulta vecinal
      summary: La consulta se convierte en un hito nacional del debate sobre participación y decisiones extractivas.
      sourceIds: [tambogrande-consulta-municipal, tambogrande-muradian-2003]
    - id: tambogrande-debate-eia
      kind: decision
      date: 2002-12-01
      datePrecision: month
      title: Presentación empresarial del EIA
      summary: Manhattan informa que presentó el EIA al MINEM y describe un proceso de revisión con talleres, comentarios públicos y respuesta empresarial.
      sourceIds: [manhattan-annual-report-2002]
    - id: tambogrande-cierre-ciclo
      kind: decision
      date: 2003-12-10
      datePrecision: day
      title: Centromin comunica terminación del acuerdo de opción
      summary: Manhattan informa que Centromin dio por terminado el acuerdo de opción; la empresa expresó desacuerdo y anunció que evaluaría acciones.
      sourceIds: [manhattan-centromin-2003]
    - id: tambogrande-desistimiento-2005
      kind: decision
      date: 2005-06-17
      datePrecision: day
      title: Desistimiento del procedimiento de evaluación
      summary: El MINEM acepta el desistimiento del procedimiento de evaluación del EIA del proyecto Tambogrande.
      sourceIds: [tambogrande-retiro-eia-2005]
    - id: tambogrande-estudio-2003
      kind: publication
      date: 2003-10-01
      datePrecision: month
      title: Publicación de estudio académico
      summary: Se publica un estudio específico sobre el conflicto ambiental del proyecto minero de Tambogrande y su relación con la población local.
      sourceIds: [tambogrande-muradian-2003]
    - id: tambogrande-algarrobo-adjudicacion
      kind: decision
      date: 2024-12-30
      datePrecision: day
      title: Adjudicación del proyecto El Algarrobo
      summary: PROINVERSIÓN comunica la adjudicación directa del proyecto El Algarrobo a Buenaventura y presenta una secuencia que comienza con gestión social y proyecto hídrico antes de exploración y estudios posteriores.
      sourceIds: [proinversion-algarrobo-adjudicacion-2024]
    - id: tambogrande-algarrobo-contrato
      kind: agreement
      date: 2025-03-25
      datePrecision: day
      title: Suscripción del contrato de opción
      summary: El MEF comunica la firma del contrato de opción y señala que alcanzar un acuerdo social con la comunidad de Locuto precede a la etapa de estudios geológicos y exploratorios.
      sourceIds: [mef-algarrobo-contrato-2025, buenaventura-algarrobo-contrato-2025]
    - id: tambogrande-algarrobo-garantias
      kind: decision
      date: 2025-05-31
      datePrecision: day
      title: Garantías estatales al contrato de opción
      summary: El Decreto Supremo 107-2025-EF otorga seguridades y garantías estatales a las obligaciones contenidas en el contrato de opción del proyecto El Algarrobo.
      sourceIds: [mef-ds-107-2025-ef]
    - id: tambogrande-algarrobo-estado-268
      kind: evidence
      date: 2026-06-30
      datePrecision: day
      title: El Algarrobo permanece en el registro activo
      summary: El Reporte 268 de la Defensoría mantiene Tambogrande - Proyecto El Algarrobo como conflicto socioambiental activo, con ingreso registrado en septiembre de 2024.
      sourceIds: [defensoria-conflictos-268]
  claims:
    - id: tambogrande-hecho-1
      kind: fact
      text: El ciclo histórico de Manhattan/TG-1 articuló controversias sobre uso del territorio, agricultura, participación y viabilidad del proyecto, y concluyó su secuencia documentada con la terminación del acuerdo de opción y el desistimiento de la evaluación del EIA.
      sourceIds: [manhattan-annual-report-2002, manhattan-centromin-2003, tambogrande-muradian-2003]
      verificationStatus: partial
    - id: tambogrande-hecho-2
      kind: fact
      text: El Algarrobo/TG-3 es un proceso contemporáneo distinto, adjudicado a Buenaventura y estructurado mediante un contrato de opción cuya versión inicial condiciona la vigencia de la opción a un acuerdo social con la Comunidad Campesina Apóstol Juan Bautista de Locuto.
      sourceIds: [proinversion-algarrobo-contrato-inicial-2024, proinversion-algarrobo-adjudicacion-2024, mef-algarrobo-contrato-2025]
      verificationStatus: verified
      verifiedAt: 2026-07-27
    - id: tambogrande-hecho-3
      kind: fact
      text: La Defensoría del Pueblo mantiene Tambogrande - Proyecto El Algarrobo como conflicto socioambiental activo en el Reporte 268, con ingreso registrado en septiembre de 2024.
      sourceIds: [defensoria-conflictos-268]
      verificationStatus: verified
      verifiedAt: 2026-07-27
    - id: tambogrande-interpretacion-1
      kind: interpretation
      text: La memoria de la consulta de 2002 influye en la lectura territorial contemporánea. Manhattan/TG-1 y El Algarrobo/TG-3 corresponden a ciclos empresariales y administrativos distintos.
      sourceIds: [tambogrande-consulta-municipal, tambogrande-muradian-2003, cooperaccion-tambogrande-2024, defensoria-conflictos-268, metodologia-observatorio]
      verificationStatus: partial
  cutoffDate: 2026-07-27
  updatedAt: 2026-07-27
  reviewStatus: documentary
  reviewNotes: Lectura académica que separa el ciclo histórico TG-1 del proceso contemporáneo TG-3 y organiza los temas sociales, hídricos, operativos y territoriales de cada etapa.
