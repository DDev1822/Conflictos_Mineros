  title: La minería ilegal avanzó dentro de la Reserva Nacional Tambopata
  summary: MAAP documentó 500 hectáreas de pérdida de bosque por minería ilegal en el norte de la reserva entre julio de 2025 y febrero de 2026.
  analysis: La expansión en un área natural protegida conecta deforestación, acceso fluvial, seguridad de guardaparques y capacidad de respuesta frente a frentes mineros móviles.
