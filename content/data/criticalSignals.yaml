- id: oro-cadena-penal-2026
  topic: oro-ilegal
  date: 2026-01-20
  title: El marco penal incorporó beneficio, transporte, acopio y exportación
  summary: El Decreto Legislativo 1695 amplió el delito de minería ilegal y el tráfico ilícito de recursos minerales a fases que van más allá de la extracción.
  analysis: La modificación reconoce que la economía ilegal necesita procesar, mover, almacenar y vender el mineral; perseguir únicamente el punto de extracción deja intacta parte de la red.
