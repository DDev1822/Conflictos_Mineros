    - id: espinar-evidencia-causalidad
      description: El MSAP 2013 y las evaluaciones OEFA 2023 documentan resultados, excedencias, fuentes posibles y límites técnicos; esos documentos coexisten con reclamos comunitarios y no resuelven por sí solos responsabilidades, reparación o cumplimiento.
      sourceIds: [espinar-msap-final-2013, espinar-oefa-causalidad-agua-2023, espinar-oefa-causalidad-suelo-2023, espinar-oefa-causalidad-animales-2023, pametec-demanda-amparo-2025, cooperaccion-espinar-2025]
      status: open
  scopeQuestions:
    - ¿Qué hallazgos ambientales cuentan con resolución firme y cuáles permanecen como evaluación o controversia técnica?
    - ¿Qué conclusiones de los informes OEFA 2023 pueden citarse como hallazgos técnicos y cuáles requieren cautela probatoria o contraste administrativo adicional?
    - ¿Qué piezas judiciales primarias verifican pretensiones, admisión, resoluciones, actas y estado procesal al corte del expediente 00042-2025-0-1009-JR-CI-01?
    - ¿Qué obligaciones derivan del convenio marco y de los acuerdos registrados, y cuál es su evidencia de cumplimiento?
  gaps:
    - id: espinar-resultados
      description: Informe final MSAP 2013 e informes OEFA 2023 de causalidad integrados con locadores exactos; queda pendiente lectura de alcance probatorio, no adquisición documental básica.
      blocksRelease: false
    - id: espinar-amparo
      description: CEJ verifica existencia, juzgado y partes del expediente 00042-2025-0-1009-JR-CI-01; faltan escrito de demanda, auto admisorio o resolución equivalente, acta de audiencia y constancia procesal para verificar pretensiones, admisión, resoluciones y estado procesal completo.
      blocksRelease: true
  status: ready
