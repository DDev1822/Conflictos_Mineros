  title: "La comunidad campesina de Huancuire señala que la empresa Minera Las Bambas no estaría cumpliendo los compromisos asumidos en el convenio marco acordado entre…"
  titleMethod: editorial-summary
  status: active
  conflictType: Socioambiental
  regionIds: [apurimac]
  sourcePage: 38
  hasMonthlyEvents: true
  startPeriod: 2021-06
  summary: "La comunidad campesina de Huancuire señala que la empresa Minera Las Bambas no estaría cumpliendo los compromisos asumidos en el convenio marco acordado entre las partes. También solicitan atender la presunta contaminación ambiental de los recursos hídricos de la zona y el reinicio de la consulta previa."
  location: "Distrito de Coyllurqui, provincia de Cotabambas, departamento Apurímac."

- id: rcs-266-006
  snapshotId: defensoria-2026-04-mining
  title: "La comunidad campesina de Fuerabamba cuestiona la reclasificación como Ruta Nacional de la carretera que cruza Fundo Yavi Yavi…"
  titleMethod: editorial-summary
  status: active
  conflictType: Socioambiental
  regionIds: [apurimac]
  sourcePage: 39
  hasMonthlyEvents: true
  startPeriod: 2018-12
  summary: "La comunidad campesina de Fuerabamba cuestiona la reclasificación como Ruta Nacional de la carretera que cruza Fundo Yavi Yavi realizada en 2018 porque afectaría su propiedad. Sostiene que la empresa Minera Las Bambas construyó el tramo sin permiso de la comunidad y exige revisar acuerdos previos sobre el proyecto minero."
  location: "Distrito de Challhuahuacho, provincia de Cotabambas, departamento Apurímac."

- id: rcs-266-008
  snapshotId: defensoria-2026-04-mining
  title: "Agricultores, pobladores y autoridades locales de la provincia de Islay se oponen al proyecto Tía María de la empresa Minera Southern Perú Copper Corporation…"
  titleMethod: editorial-summary
  status: active
  conflictType: Socioambiental
  regionIds: [arequipa]
  sourcePage: 41
  hasMonthlyEvents: true
  startPeriod: 2013-10
  summary: "Agricultores, pobladores y autoridades locales de la provincia de Islay se oponen al proyecto Tía María de la empresa Southern Perú Copper Corporation por temor a posibles daños ambientales. El proyecto ha enfrentado oposición, evaluaciones ambientales y protestas recurrentes desde 2009 hasta la actualidad."
  location: "Distritos de Deán Valdivia, Cocachacra y Punta Bombón, provincia de Islay, departamento Arequipa."

