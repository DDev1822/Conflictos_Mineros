    "hasMonthlyEvents": true,
    "startPeriod": "2013-10",
    "summary": "Agricultores, pobladores y autoridades locales de provincia de Islay se oponen al proyecto Tía María de la empresa minera Southern Perú Copper Corporation (SPCC) por temor posibles daños ambientales. Cabe precisar que este caso fue reportado en agosto de 2009 hasta abril de 2011 en que se llega una solución con la emisión de la Resolución Directoral N° 105- 2011 –MEM-AAM del Ministerio de Energía y Minas que declara inadmisible el Estudio de Impacto Ambiental del proyecto Tía María presentado por la empresa minera SPCC. En agosto de 2014 aprueba el EIA y el conflicto se reinicia produciéndose graves hechos de violencia. Ante el vencimiento del plazo de vigencia del EIA, el Gobierno le ha otorgado a la empresa la licencia construcción. Esta decisión generó protestas en las provincias Islay y Arequipa, A marzo del 2023, el proyecto Tía María fue considerado en la Cartera de Proyectos de Inversión del MINEM, lo cual ha generado protestas.",
    "location": "Distritos de Deán Valdivia, Cocachacra y Punta Bombón, provincia de Islay, departamento de Arequipa."
  },
