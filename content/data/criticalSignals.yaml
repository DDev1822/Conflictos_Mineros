- id: reinfo-depuracion-2025
  topic: reinfo
  date: 2025-07-04
  title: La depuración redujo el universo del proceso
  summary: El MINEM informó que 31.560 inscripciones continuarían en el proceso y que 50.565 registros suspendidos por más de un año quedaban excluidos.
  analysis: La depuración de 2025 cambió la escala del REINFO y mostró cuánto había crecido el grupo suspendido frente al universo que continuó en formalización.
  metrics:
    - { value: "31.560", label: "continuaron en el proceso" }
    - { value: "50.565", label: "fueron excluidos" }
  sourceIds: [minem-rd-0004-2025-reinfo-exclusiones, minem-comunicado-reinfo-2025]

- id: reinfo-formalizacion-2-4-2025
  topic: reinfo
  date: 2025-07-12
  title: El Ejecutivo reconoció un avance de formalización de apenas 2,4%
  summary: La Presidencia del Consejo de Ministros señaló que, de más de 84.000 inscripciones acumuladas en el REINFO, solo 2,4% había culminado la formalización.
  analysis: "El porcentaje revela el problema central del régimen transitorio: el registro creció durante años mientras la salida hacia la formalidad avanzó a una velocidad muy inferior."
  metrics:
    - { value: "2,4%", label: "formalización acumulada informada" }
    - { value: "+84.000", label: "inscripciones acumuladas" }
  sourceIds: [pcm-reinfo-formalizacion-2025]

- id: reinfo-extension-2026
  topic: reinfo
  date: 2025-12-27
  title: El proceso fue ampliado nuevamente hasta diciembre de 2026
  summary: La Ley 32537 extendió el proceso hasta el 31 de diciembre de 2026 o hasta la entrada en vigor de la Ley MAPE y su reglamento.
  analysis: La ampliación incorporó un censo nacional, el reporte obligatorio de la ubicación real de las operaciones y la transferencia de expedientes regionales al MINEM.
  metrics:
    - { value: "31 dic. 2026", label: "nuevo límite del proceso" }
    - { value: "120 días", label: "plazo para informar ubicación real" }
  sourceIds: [minem-ley-32537-reinfo-2026]

- id: reinfo-balance-bcrp-2026
  topic: reinfo
  date: 2026-04-20
  title: El balance del BCRP muestra un proceso largo y de baja salida anual
  summary: La Memoria 2025 del BCRP registró 31.610 inscripciones al 20 de abril de 2026 y una serie de 2.295 formalizaciones entre 2014 y 2025.
  analysis: La serie anual citada por el BCRP permite observar la caída desde 728 formalizaciones en 2017 hasta cinco en 2025 y evaluar el resultado más allá del tamaño del registro.
  metrics:
    - { value: "31.610", label: "inscripciones al 20 abr. 2026" }
