    "startPeriod": "2026-01",
    "summary": "El 03 de enero de 2026, aproximadamente 70 agricultores provenientes de diversos caseríos del distrito de Cáceres del Perú– Jimbe bloquearon la carretera de ingreso al caserío de Colcap, utilizando una cadena de fierro. Ante esta situación, personal policial intentó restablecer el tránsito en aplicación del Decreto Legislativo N.° 1186; sin embargo, los manifestantes reaccionaron arrojando ladrillos y piedras contra los efectivos policiales. Frente ello, el personal policial se replegó en dirección al centro poblado de Jimbe, no siendo posible el retiro de los manifestantes. Los pobladores demandan el cese de la presunta contaminación ambiental atribuida a las empresas mineras Bahema Trade S.A.C. y Pacífico Dorado, señalando afectaciones a las fuentes de agua utilizadas para la agricultura y el consumo humano, así como generación de polvareda que estaría impactando negativamente la salud de las personas, los cultivos y los animales.",
    "location": "Distrito de Cáceres del Perú, provincia del Santa, departamento de Áncash."
  },
