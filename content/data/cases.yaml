      kind: agreement
      date: 2001-01-01
      datePrecision: year
      title: Partes acuerdan una evaluación independiente de salud
      summary: Tras la queja del Frente de Defensa, CAO facilitó una evaluación independiente de salud y el seguimiento de recomendaciones; el caso de mediación cerró en 2003 y el estudio sanitario más amplio quedó pendiente.
      sourceIds: [choropampa-cao-caso]
    - id: choropampa-informe-defensorial-2001
      kind: publication
      date: 2001-12-01
      datePrecision: month
      title: Defensoría publica el Informe 62
      summary: La Defensoría sistematizó hechos, respuesta estatal, derechos, responsabilidades y recomendaciones, y señaló debilidades de fiscalización y coordinación institucional.
