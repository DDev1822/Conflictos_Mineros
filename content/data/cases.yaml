      sourceIds: [choropampa-defensoria-62]
    - id: choropampa-investigacion-cao-2000
      kind: evidence
      date: 2000-07-01
      datePrecision: month
      title: Comisión independiente reconstruye causas y respuesta
      summary: La comisión convocada para CAO examinó transporte, envasado, cronología, comunicación, limpieza y atención, e identificó deficiencias en procedimientos de residuos y emergencia.
      sourceIds: [choropampa-cao-investigacion-2000]
    - id: choropampa-convenio-comunidad-2000
