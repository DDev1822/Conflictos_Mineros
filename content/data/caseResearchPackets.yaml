    - ¿Qué resultados verificables produjeron los acuerdos de 2018, el convenio marco y las sesiones posteriores de la mesa?
    - ¿Qué expediente judicial sustentó el desalojo reportado en septiembre de 2025 y qué decisiones posteriores existen?
    - ¿Qué indicadores independientes permiten evaluar vivienda, empleo, servicios, movilidad, economía y arraigo en Nueva Morococha?
  gaps:
    - id: morococha-instrumentos-sociales
      description: Faltan el EIA y MEIA completos, el plan de reasentamiento, el Plan de Acción y sus matrices de obligaciones y seguimiento con locadores finos.
      blocksRelease: false
    - id: morococha-actas-cumplimiento
      description: No se incorporaron todas las actas de la mesa, el convenio marco ni una matriz pública de cumplimiento de los acuerdos de 2018.
      blocksRelease: false
    - id: morococha-familias-compensaciones
      description: Falta una relación trazable de familias reasentadas, no reasentadas, compensadas y tituladas, con criterios, fechas y fuentes registrales.
      blocksRelease: false
    - id: morococha-expediente-desalojo
      description: El desalojo de septiembre de 2025 se conserva como hecho reportado porque falta el expediente judicial primario completo, el acta de lanzamiento y decisiones posteriores.
      blocksRelease: false
    - id: morococha-indicadores-independientes
      description: Las afirmaciones corporativas de calidad de vida requieren contraste con indicadores independientes y fuentes directas representativas de experiencias diversas.
      blocksRelease: false
  status: ready
- id: research-choropampa
  caseId: choropampa
  depth: deep
  substantiveMilestoneTarget: 8
  cutoffDate: 2026-07-27
  currentStatusSummary: Choropampa queda integrado como caso histórico autónomo con derrame, respuesta, atención agregada, fiscalización, evaluación independiente, acuerdos y litigio trazados; no forma parte de los 61 conflictos sociales mineros del Reporte 268.
  sourceIds: [choropampa-defensoria-62, choropampa-cao-investigacion-2000, choropampa-cao-caso, choropampa-pj-pleno-2008, choropampa-newmont-10k-2002, choropampa-newmont-relaciones-2009]
  directActorSourceIds: [choropampa-cao-caso, choropampa-newmont-10k-2002, choropampa-newmont-relaciones-2009]
  actorPositions:
    - actor: Población y Frente de Defensa de Choropampa
      position: La queja resumida por CAO y las entrevistas de la revisión corporativa registran preocupación por efectos de largo plazo, compromisos alegadamente incumplidos y falta de confianza en una respuesta considerada completa.
      sourceIds: [choropampa-cao-caso, choropampa-newmont-relaciones-2009]
    - actor: Defensoría y autoridades estatales
      position: La Defensoría documentó afectación, debilidades de fiscalización y coordinación, atención estatal, sanción y deberes diferenciados de salud, minería, justicia y gobierno territorial.
      sourceIds: [choropampa-defensoria-62]
    - actor: Minera Yanacocha y Newmont
      position: La empresa reportó programa de remediación, multa pagada bajo protesta, transacciones, obras públicas y posteriores mejoras de transporte y respuesta de emergencia.
      sourceIds: [choropampa-newmont-10k-2002, choropampa-newmont-relaciones-2009]
    - actor: RANSA Comercial
      position: La transportista aparece en la reconstrucción del traslado, el derrame y los litigios; el expediente no atribuye a una sola entidad todas las responsabilidades administrativas, civiles, penales o sanitarias.
      sourceIds: [choropampa-defensoria-62, choropampa-pj-pleno-2008]
  contradictions:
    - id: choropampa-extension-derrame
      description: La Defensoría sitúa el derrame en aproximadamente 27 km, mientras la investigación CAO lo reconstruye en unos 40 km y su ficha pública usa 41 km; se conserva la discrepancia sin elegir una precisión falsa.
      sourceIds: [choropampa-defensoria-62, choropampa-cao-investigacion-2000, choropampa-cao-caso]
      status: resolved
    - id: choropampa-atencion-causalidad
      description: Los registros agregados acreditan atención, exposición y síntomas, pero también diferencias de clasificación clínica; no permiten generalizar causalidad individual ni estado médico actual.
      sourceIds: [choropampa-defensoria-62, choropampa-cao-investigacion-2000]
      status: resolved
    - id: choropampa-reparacion
      description: La empresa reporta remediación, transacciones y obras, mientras fuentes institucionales y la propia revisión corporativa registran preocupación, litigios y desconfianza persistente; acuerdo documentado no equivale a reparación integral.
      sourceIds: [choropampa-defensoria-62, choropampa-pj-pleno-2008, choropampa-newmont-10k-2002, choropampa-newmont-relaciones-2009]
      status: resolved
  scopeQuestions:
    - ¿Qué obligaciones concretas de salud, ambiente, transporte y comunicación quedaron asignadas a cada entidad y qué evidencia posterior demuestra su cumplimiento?
    - ¿Qué diferencia debe mantener el observatorio entre persona atendida, exposición medida, intoxicación diagnosticada y causalidad médica individual?
    - ¿Qué cubrió cada transacción o convenio, quién la suscribió y qué derechos o reclamos quedaron fuera de su alcance?
    - ¿Qué cambios de transporte y respuesta de emergencia fueron implementados y qué verificación independiente existe sobre su continuidad?
  gaps:
    - id: choropampa-expediente-sanitario
      description: Faltan series sanitarias anonimizadas y comparables de largo plazo con metodología, población, seguimiento y límites para evaluar resultados sin invadir privacidad ni inferir diagnósticos individuales.
      blocksRelease: false
    - id: choropampa-matriz-reparacion
      description: Falta una matriz pública por transacción, convenio, obra, responsable, beneficiario colectivo, plazo y evidencia de ejecución que permita evaluar cobertura sin declarar reparación integral.
      blocksRelease: false
    - id: choropampa-expedientes-judiciales
      description: El paquete incorpora el Primer Pleno Casatorio, pero no la totalidad de procesos civiles, penales, arbitrales y sus decisiones finales vinculadas con todas las personas demandantes.
      blocksRelease: false
    - id: choropampa-fuentes-comunitarias
      description: Faltan documentos directos archivados del Frente de Defensa, actas comunales, municipalidad y testimonios representativos con consentimiento y contexto temporal verificable.
      blocksRelease: false
  status: ready
- id: research-fondo-social-michiquillay
  caseId: fondo-social-michiquillay
  depth: deep
  substantiveMilestoneTarget: 8
  cutoffDate: 2026-07-27
  currentStatusSummary: Michiquillay queda integrado como conflicto social minero histórico y experimento institucional de gestión social; una acción colectiva de 2025 acredita contestación reciente, pero el caso no figura entre los 61 conflictos mineros del Reporte 268.
  sourceIds: [michiquillay-defensoria-73, michiquillay-defensoria-90, michiquillay-defensoria-256, michiquillay-fsm-sobre, michiquillay-fsm-informes, michiquillay-mef-ds-082-2008, michiquillay-minem-contrato-2018, michiquillay-proinversion-2018, michiquillay-minem-memoria-2018, michiquillay-oefa-diagnostico-2019, michiquillay-pucp-2021, michiquillay-sec-10q-2026]
  directActorSourceIds: [michiquillay-fsm-sobre, michiquillay-fsm-informes, michiquillay-sec-10q-2026]
  actorPositions:
    - actor: Comunidades campesinas Michiquillay y La Encañada
      position: Los reportes defensoriales registran demandas por remediación, acuerdos y cumplimiento del Fondo; la acción de 2025 muestra que la provisión de infraestructura educativa seguía siendo objeto de movilización.
      sourceIds: [michiquillay-defensoria-73, michiquillay-defensoria-90, michiquillay-defensoria-256]
    - actor: Asociación Fondo Social Michiquillay
      position: El Fondo se presenta como asociación orientada a administrar recursos y ejecutar programas y proyectos, y expone un archivo de gestión, auditoría y control para consulta pública.
      sourceIds: [michiquillay-fsm-sobre, michiquillay-fsm-informes]
    - actor: Estado y entidades de promoción y supervisión
      position: La Defensoría, PROINVERSIÓN, MINEM y OEFA documentan respectivamente conflicto, transferencias, arquitectura institucional y condiciones territoriales, sin que una sola entidad certifique todo el desempeño del Fondo.
      sourceIds: [michiquillay-defensoria-73, michiquillay-proinversion-2018, michiquillay-minem-memoria-2018, michiquillay-oefa-diagnostico-2019]
    - actor: Southern Perú
      position: La empresa reporta acuerdos sociales, programas y compromisos en agricultura, educación, agua, residuos y salud mientras el proyecto continúa en estudios.
      sourceIds: [michiquillay-sec-10q-2026]
    - actor: Investigación académica
      position: La tesis revisada identifica problemas de representación y conocimiento de reglas como factores que afectan expectativas y percepción de funcionamiento; el observatorio conserva ese hallazgo como análisis situado.
      sourceIds: [michiquillay-pucp-2021]
  contradictions:
    - id: michiquillay-institucion-conflicto
      description: La constitución del Fondo y su continuidad administrativa coexisten con reclamos de implementación y cumplimiento registrados por la Defensoría; institución existente no equivale a legitimidad ni consenso.
      sourceIds: [michiquillay-fsm-sobre, michiquillay-defensoria-73, michiquillay-defensoria-90]
      status: resolved
    - id: michiquillay-recursos-impacto
      description: PROINVERSIÓN documenta la transferencia de recursos y el Fondo publica informes, mientras OEFA registra brechas territoriales y la Defensoría una demanda educativa posterior; monto transferido no prueba impacto suficiente.
      sourceIds: [michiquillay-proinversion-2018, michiquillay-fsm-informes, michiquillay-oefa-diagnostico-2019, michiquillay-defensoria-256]
      status: resolved
    - id: michiquillay-representacion
      description: La arquitectura formal contempla participación comunal, pero la investigación académica reporta límites de representación y conocimiento de reglas; el expediente distingue diseño institucional de experiencia social.
      sourceIds: [michiquillay-minem-memoria-2018, michiquillay-pucp-2021]
      status: resolved
    - id: michiquillay-estado-actual
      description: Existe acción colectiva reciente y el proyecto sigue activo, pero Michiquillay no aparece como caso vigente dentro de la selección minera del Reporte 268; el estado latente es editorial, no una etiqueta defensorial actual.
      sourceIds: [michiquillay-defensoria-256, michiquillay-sec-10q-2026, defensoria-conflictos-268]
      status: resolved
  scopeQuestions:
    - ¿Cómo se distribuye la capacidad de decisión entre comunidades, empresa, directorio, consejo de vigilancia y entidades estatales?
    - ¿Qué recursos fueron transferidos, comprometidos y ejecutados por proyecto, y qué resultados verificables produjeron en cada sector beneficiario?
    - ¿Qué compromisos de los acuerdos de 2008, 2010 y 2021 cuentan con acta, responsable, plazo, indicador y evidencia posterior de cumplimiento?
    - ¿Qué diferencias existen entre transparencia documental, control financiero, desempeño institucional, legitimidad representativa e impacto territorial?
  gaps:
    - id: michiquillay-actas-estatuto
      description: Faltan el estatuto vigente consolidado, actas comunales y de directorio, reglamentos internos y reglas completas de representación y contratación.
      blocksRelease: false
    - id: michiquillay-matriz-ejecucion
      description: Falta una matriz reconciliada por transferencia, proyecto, costo, plazo, beneficiario, recepción, auditoría y resultado territorial verificable.
      blocksRelease: false
    - id: michiquillay-acuerdos-completos
      description: No están incorporados los textos completos de los acuerdos sociales de 2008 y 2021 ni una trazabilidad obligación por obligación.
      blocksRelease: false
    - id: michiquillay-voz-comunitaria
      description: Faltan actas y documentos directos archivados de sectores y organizaciones comunales que permitan representar desacuerdos internos sin generalizar una sola voz comunitaria.
      blocksRelease: false
  status: ready
- id: research-rio-blanco-majaz
  caseId: rio-blanco-majaz
  depth: deep
  substantiveMilestoneTarget: 8
  cutoffDate: 2026-07-27
  currentStatusSummary: Río Blanco–Majaz queda integrado como conflicto socioambiental minero activo con autorización superficial, exploración, consulta vecinal, violencia, fiscalización, rehabilitación y reactivación trazadas; el Reporte 268 lo mantiene activo.
  sourceIds: [rio-blanco-defensoria-informe-2006, rio-blanco-minem-ea-2003, rio-blanco-defensoria-reporte-36, rio-blanco-defensoria-reporte-139, rio-blanco-osinergmin-444-2008, rio-blanco-minem-desistimiento-2009, rio-blanco-minem-rehabilitacion-2016, rio-blanco-minem-rehabilitacion-2020, rio-blanco-defensoria-reporte-246, rio-blanco-empresa-proyecto-2026, rio-blanco-red-muqui-2024, rio-blanco-iep-2009, defensoria-conflictos-268]
  directActorSourceIds: [rio-blanco-empresa-proyecto-2026, rio-blanco-red-muqui-2024]
  actorPositions:
    - actor: Comunidades campesinas Yanta y Segunda y Cajas
      position: Los reportes defensoriales y las vocerías recogidas por Red Muqui registran oposición al proyecto, defensa de agricultura, páramos y bosques, y cuestionamientos sobre autorización y presencia empresarial.
      sourceIds: [rio-blanco-defensoria-informe-2006, rio-blanco-defensoria-reporte-246, rio-blanco-red-muqui-2024]
    - actor: Rondas y organizaciones territoriales de Ayabaca y Huancabamba
      position: Las organizaciones sostienen la vigencia política de la consulta de 2007, solicitan protección territorial y plantean demandas frente a concesiones y contactos empresariales.
      sourceIds: [rio-blanco-defensoria-reporte-246, rio-blanco-red-muqui-2024]
    - actor: Río Blanco Copper
      position: La empresa presenta el proyecto en prefactibilidad, sostiene que fue rediseñado para excluir páramos y afirma que no afectará ecosistemas frágiles ni fuentes de agua, junto con beneficios económicos proyectados.
      sourceIds: [rio-blanco-empresa-proyecto-2026]
    - actor: Defensoría, MINEM y OSINERGMIN
      position: Las entidades documentan respectivamente autorización superficial insuficientemente acreditada, decisiones de evaluación ambiental, sanción y rehabilitación, y seguimiento de un conflicto activo sin diálogo.
      sourceIds: [rio-blanco-defensoria-informe-2006, rio-blanco-minem-ea-2003, rio-blanco-osinergmin-444-2008, rio-blanco-defensoria-reporte-246, defensoria-conflictos-268]
    - actor: Investigación académica
      position: El estudio del IEP analiza el caso como una disputa por legalidad, propiedad, participación y futuro agrícola o minero de la sierra de Piura; el observatorio conserva esa lectura como interpretación situada.
      sourceIds: [rio-blanco-iep-2009]
  contradictions:
    - id: rio-blanco-autorizacion-formal-comunal
      description: La evaluación ambiental fue aprobada y existían documentos suscritos por directivas, pero la Defensoría concluyó que estos no acreditaban el acuerdo de dos tercios de las asambleas; autorización administrativa y disponibilidad superficial no se sustituyen entre sí.
      sourceIds: [rio-blanco-minem-ea-2003, rio-blanco-defensoria-informe-2006]
      status: resolved
    - id: rio-blanco-consulta-alcance
      description: La consulta vecinal expresó rechazo territorial al proyecto, pero el expediente no la convierte en consulta previa ni en veto jurídico automático; se distinguen legitimidad política, participación y efecto legal.
      sourceIds: [rio-blanco-defensoria-reporte-139, rio-blanco-iep-2009]
      status: resolved
    - id: rio-blanco-rehabilitacion-cierre
      description: La sanción de 2008 ordenó rehabilitación y el MINEM aprobó modificaciones en 2016 y 2020; esa secuencia acredita seguimiento documental, pero no prueba por sí sola culminación física, conformidad comunal o cierre del conflicto.
      sourceIds: [rio-blanco-osinergmin-444-2008, rio-blanco-minem-rehabilitacion-2016, rio-blanco-minem-rehabilitacion-2020]
      status: resolved
    - id: rio-blanco-rediseno-conflicto
      description: La empresa sostiene que el proyecto rediseñado excluye páramos y evita afectaciones, mientras comunidades y rondas mantienen objeciones y la Defensoría registra el conflicto activo; las posiciones quedan atribuidas y no reconciliadas como hecho único.
      sourceIds: [rio-blanco-empresa-proyecto-2026, rio-blanco-defensoria-reporte-246, rio-blanco-red-muqui-2024, defensoria-conflictos-268]
      status: resolved
  scopeQuestions:
    - ¿Qué actas completas, padrones y reglas comunales permiten reconstruir la autorización, sus objeciones y las decisiones internas de Yanta y Segunda y Cajas?
    - ¿Qué alcance normativo, municipal y político tuvo la consulta vecinal de 2007 y cómo se diferencia de participación ambiental y consulta previa?
    - ¿Qué componentes fueron intervenidos, rehabilitados y verificados, y qué indicadores técnicos o actas territoriales permiten evaluar el resultado de cada plan?
    - ¿Qué cambios concretos contiene el rediseño actual del proyecto y qué estudios ambientales, hídricos y sociales independientes permiten contrastar las afirmaciones empresariales y comunitarias?
  gaps:
    - id: rio-blanco-actas-comunales
      description: Faltan las actas integrales, padrones, estatutos, convocatorias y registros de asamblea de 2002 y decisiones posteriores de ambas comunidades.
      blocksRelease: false
    - id: rio-blanco-consulta-expediente
      description: Faltan ordenanzas, actas, cédulas, resultados distritales completos y expediente municipal consolidado de la consulta vecinal de septiembre de 2007.
      blocksRelease: false
    - id: rio-blanco-procesos-judiciales
      description: No se incorporó la totalidad de expedientes fiscales, penales, constitucionales o civiles derivados de protestas, detenciones, denuncias y controversias territoriales.
      blocksRelease: false
    - id: rio-blanco-rehabilitacion-ejecucion
      description: Faltan informes de cierre, verificación en campo, indicadores, coordenadas, actas de conformidad y resultados independientes para evaluar la ejecución material de la rehabilitación.
      blocksRelease: false
    - id: rio-blanco-estudios-actuales
      description: El expediente no contiene los estudios actuales de prefactibilidad, rediseño, agua, biodiversidad, impactos acumulativos o participación que permitan contrastar integralmente la página corporativa.
      blocksRelease: false
  status: ready
