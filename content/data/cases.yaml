  timeline:
    - id: michiquillay-adjudicacion-2007
      kind: decision
      date: 2007-04-30
      datePrecision: day
      title: Anglo American obtiene la buena pro de Michiquillay
      summary: La historia institucional del Fondo sitúa en esta fecha la adjudicación del proyecto a Anglo American Michiquillay, inicio del primer ciclo privado reconstruido por el expediente.
      sourceIds: [michiquillay-fsm-sobre]
    - id: michiquillay-acuerdos-sociales-2008
      kind: agreement
      date: 2008-05-23
      datePrecision: day
      title: Acuerdos sociales con La Encañada y Michiquillay
      summary: Anglo American suscribió acuerdos sociales con La Encañada el 23 de mayo y con Michiquillay el 3 de junio de 2008; el expediente todavía no incorpora las actas y obligaciones completas.
      sourceIds: [michiquillay-fsm-sobre]
    - id: michiquillay-fondo-2009
      kind: agreement
      date: 2009-06-05
      datePrecision: day
      title: Transferencia de recursos y constitución del Fondo Social
      summary: Una adenda dispuso transferir al Fondo el 50 por ciento de determinados pagos del precio ofertado y durante 2009 se constituyó la asociación encargada de gestionar programas y proyectos locales.
      sourceIds: [michiquillay-fsm-sobre, michiquillay-minem-memoria-2018]
    - id: michiquillay-dialogo-2010
      kind: agreement
      date: 2010-03-09
      datePrecision: day
      title: Diálogo reanudado y seis grupos de trabajo
      summary: La Defensoría registró reuniones de diálogo y acuerdos para constituir e implementar el Fondo, establecer un procedimiento de comunicación y organizar grupos sobre empleo, ambiente, fondo social, exploración, reasentamiento y otros asuntos.
      sourceIds: [michiquillay-defensoria-73]
    - id: michiquillay-demanda-fondo-2011
      kind: evidence
      date: 2011-08-01
      datePrecision: month
      title: Reclamo comunal por cumplimiento y ejecución del Fondo
      summary: La Defensoría mantuvo el caso como conflicto socioambiental y describió la demanda de la comunidad de Michiquillay para que se cumplieran y ejecutaran los compromisos del Fondo Social.
      sourceIds: [michiquillay-defensoria-90]
    - id: michiquillay-retiro-anglo-2014
      kind: event
      date: 2014-12-04
      datePrecision: day
      title: Anglo American se retira del proyecto
      summary: La salida de Anglo American cambió la composición empresarial del proyecto; la asociación y los recursos del Fondo continuaron vigentes.
      sourceIds: [michiquillay-fsm-sobre]
    - id: michiquillay-proinversion-2015
      kind: decision
      date: 2015-03-11
      datePrecision: day
      title: PROINVERSIÓN asume como asociado transitorio
      summary: PROINVERSIÓN se incorporó temporalmente a la Asociación Fondo Social Michiquillay mientras se definía un nuevo inversionista para el proyecto.
      sourceIds: [michiquillay-fsm-sobre, michiquillay-minem-memoria-2018]
    - id: michiquillay-adjudicacion-southern-2018
      kind: decision
      date: 2018-02-20
      datePrecision: day
      title: Southern Perú obtiene la nueva buena pro
      summary: PROINVERSIÓN adjudicó a Southern Perú el proyecto Michiquillay; el contrato de transferencia fue suscrito el 12 de junio de 2018.
      sourceIds: [michiquillay-fsm-sobre, michiquillay-minem-contrato-2018]
    - id: michiquillay-transferencia-fondo-2018
      kind: evidence
      date: 2018-11-08
      datePrecision: day
      title: Pago inicial trasladado al Fondo Social
      summary: PROINVERSIÓN informó que el pago inicial de 12,5 millones de dólares efectuado por Southern había sido trasladado al Fondo; ese ingreso se compara con los proyectos ejecutados posteriormente.
      sourceIds: [michiquillay-proinversion-2018]
    - id: michiquillay-diagnostico-oefa-2019
      kind: evidence
      date: 2019-11-29
      datePrecision: day
      title: OEFA documenta organización y brechas territoriales
      summary: Un diagnóstico social registró divisiones organizativas, limitaciones de agua, saneamiento, salud y educación, así como intervenciones atribuidas al Fondo, sin evaluar integralmente su desempeño.
      sourceIds: [michiquillay-oefa-diagnostico-2019]
    - id: michiquillay-acuerdos-southern-2021
      kind: agreement
      date: 2021-01-01
      datePrecision: year
      title: Southern reporta acuerdos sociales con las comunidades
      summary: Southern declaró ante la SEC que en 2021 suscribió acuerdos sociales con Michiquillay y La Encañada; el expediente no contiene los textos completos ni una matriz independiente de cumplimiento.
      sourceIds: [michiquillay-sec-10q-2026]
    - id: michiquillay-demanda-escuela-2025
      kind: event
      date: 2025-06-10
      datePrecision: day
      title: Movilización por la institución educativa de Michiquillay
      summary: La Defensoría registró una concentración en Cajamarca para exigir que la empresa y el Fondo construyeran la institución educativa 82154.
      sourceIds: [michiquillay-defensoria-256]
    - id: michiquillay-estado-proyecto-2026
      kind: evidence
      date: 2026-03-31
      datePrecision: day
      title: Proyecto en estudios y compromisos sociales reportados
      summary: Southern informó que continuaban los estudios y reportó líneas de apoyo en agricultura, educación, agua, residuos y salud, con producción esperada para 2032; son declaraciones corporativas sujetas a contraste.
      sourceIds: [michiquillay-sec-10q-2026]
  claims:
    - id: michiquillay-hecho-conflicto
      kind: fact
      text: La Defensoría registró a Michiquillay como conflicto socioambiental por pasivos, acuerdos y ejecución del Fondo Social, con diálogo y reclamos de cumplimiento documentados entre 2010 y 2011.
      sourceIds: [michiquillay-defensoria-73, michiquillay-defensoria-90]
      verificationStatus: verified
      verifiedAt: 2026-07-27
    - id: michiquillay-hecho-fondo
      kind: fact
      text: En 2009 se constituyó la Asociación Fondo Social Michiquillay y una adenda vinculó al Fondo el 50 por ciento de determinados pagos del precio ofertado por el proyecto.
      sourceIds: [michiquillay-fsm-sobre, michiquillay-minem-memoria-2018]
      verificationStatus: verified
      verifiedAt: 2026-07-27
    - id: michiquillay-hecho-transicion
      kind: fact
      text: La gobernanza del Fondo atravesó la salida de Anglo American, la incorporación transitoria de PROINVERSIÓN y el ingreso de Southern Perú como nuevo asociado en 2018.
      sourceIds: [michiquillay-fsm-sobre, michiquillay-minem-memoria-2018]
      verificationStatus: verified
      verifiedAt: 2026-07-27
    - id: michiquillay-hecho-transferencia
      kind: fact
      text: PROINVERSIÓN informó en noviembre de 2018 que el pago inicial de 12.5 millones de dólares de Southern había sido trasladado al Fondo Social Michiquillay.
      sourceIds: [michiquillay-proinversion-2018]
      verificationStatus: verified
      verifiedAt: 2026-07-27
    - id: michiquillay-hecho-transparencia
      kind: fact
      text: El portal del Fondo publica gestión, auditoría, control interno y estados financieros; el análisis de resultados exige conectarlos con obras terminadas, servicios activos y población atendida.
      sourceIds: [michiquillay-fsm-informes]
      verificationStatus: verified
      verifiedAt: 2026-07-27
    - id: michiquillay-hecho-territorio
      kind: fact
      text: El diagnóstico social de OEFA documentó organización comunal, brechas de servicios y acciones atribuidas al Fondo en Michiquillay al corte de 2019.
      sourceIds: [michiquillay-oefa-diagnostico-2019]
      verificationStatus: verified
      verifiedAt: 2026-07-27
    - id: michiquillay-hecho-estado
      kind: fact
      text: La movilización de junio de 2025 expresa una demanda colectiva vinculada con la empresa y el Fondo. Michiquillay se presenta como caso hito territorial, separado del universo de 61 conflictos del Reporte 268.
      sourceIds: [michiquillay-defensoria-256, defensoria-conflictos-268]
      verificationStatus: verified
      verifiedAt: 2026-07-27
    - id: michiquillay-interpretacion
      kind: interpretation
      text: Michiquillay muestra que un mecanismo creado para distribuir beneficios puede convertirse en una arena de conflicto sobre representación, prioridades, ejecución y confianza.
      sourceIds: [michiquillay-defensoria-73, michiquillay-defensoria-90, michiquillay-oefa-diagnostico-2019, michiquillay-pucp-2021, metodologia-observatorio]
      verificationStatus: partial
