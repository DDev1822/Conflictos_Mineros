- id: pataz-control-fragil-2025
  topic: pataz
  date: 2025-05-15
  title: El control del transporte de mineral operaba con recursos mínimos
  summary: Una investigación de El Comercio encontró un puesto policial con dos agentes por turno para revisar cientos de camiones y al menos 3.800 vehículos sin registro en diez meses.
  analysis: La extracción clandestina depende de transporte, procesamiento, explosivos y compra de mineral; controlar solo bocaminas deja abiertos los eslabones que convierten roca extraída en oro comercializable.
  metrics:
    - { value: "2", label: "policías por turno en Chagualito" }
    - { value: "3.800", label: "camiones sin registro en diez meses" }
    - { value: "+450", label: "socavones abastecidos según la investigación" }
  sourceIds: [elcomercio-pataz-radiografia-2025]

