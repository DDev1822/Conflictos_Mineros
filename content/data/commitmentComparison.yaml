id: mining-social-conflict-commitments
cutoffDate: 2026-07-27
scope: Comparación académica de compromisos documentados dentro de los trece expedientes trazados de conflictos sociales mineros; no es un registro general de inversión social ni una evaluación legal.
methodology: Cada entrada parte de un hito canónico y distingue existencia documental, seguimiento y evidencia de ejecución; una nota, acta o contrato no se convierte automáticamente en prueba de cumplimiento integral.
excludedCaseIds: [conga, tia-maria, la-oroya, yanacocha-maxima-acuna]
entries:
  - id: tambogrande-agua-acuerdo-social
    caseId: tambogrande
    timelineEventId: tambogrande-algarrobo-contrato
    theme: water
    title: Agua y acuerdo social antes de exploración
    commitment: Identificar fuentes de agua para Locuto y alcanzar un acuerdo social como condición previa al inicio de estudios geológicos y exploratorios de El Algarrobo.
    responsibleActors: [Compañía de Minas Buenaventura, PROINVERSIÓN]
    territorialScope: Centro poblado Locuto y ocho anexos, Tambogrande
    documentBasis: contract-condition
    documentaryStage: condition-documented
    implementationEvidence: not-located
    evidenceSummary: El contrato inicial y la comunicación del MEF documentan la secuencia agua, acuerdo social y posterior exploración.
    limit: No se localizó el acuerdo social concluido, el diseño hídrico final, obra ejecutada, agua entregada ni inicio de exploración.
    sourceIds: [proinversion-algarrobo-contrato-inicial-2024, mef-algarrobo-contrato-2025, buenaventura-algarrobo-contrato-2025]
    checkedAt: 2026-07-27

