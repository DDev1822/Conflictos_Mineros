# Lista filtrada de casos de conflictos sociales relacionados con minería.
# Estos registros se extraen del informe de la Defensoría del Pueblo (reporte 266, corte abril 2026) y se limitan a conflictos donde el título o la descripción mencionan minería, actividades mineras o compañías mineras.

- id: rcs-266-001
  snapshotId: defensoria-2026-04-mining
  title: "El 03 de enero de 2026, aproximadamente 70 agricultores provenientes de diversos caseríos del distrito de Cáceres del Perú– Jimbe bloquearon la carretera de…"
  titleMethod: editorial-summary
  status: active
  conflictType: Socioambiental
  regionIds: [ancash]
  sourcePage: 37
  hasMonthlyEvents: true
  startPeriod: 2026-01
  summary: "El 03 de enero de 2026, aproximadamente 70 agricultores del distrito de Cáceres del Perú– Jimbe bloquearon la carretera de ingreso al caserío de Colcap. La protesta respondió a la presunta contaminación ambiental atribuida a las empresas mineras Bahema Trade S.A.C. y Pacífico Dorado, señalando afectaciones a las fuentes de agua utilizadas para la agricultura y el consumo humano, así como generación de polvareda que estaría impactando negativamente la salud de las personas, los cultivos y los animales."
  location: "Distrito de Cáceres del Perú, provincia del Santa, departamento de Áncash."

