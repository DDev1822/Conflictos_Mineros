- id: rio-blanco-majaz
  slug: rio-blanco-majaz
  name: Río Blanco–Majaz
  summary: Conflicto socioambiental minero activo en Piura sobre autorización para usar tierras comunales, exploración, páramos y bosques de montaña, consulta vecinal, protesta, fiscalización, rehabilitación y legitimidad territorial.
  period: { start: 2004, end: null }
  status: active
  territoryIds: [rio-blanco-piura]
  actorIds: [comunidades-yanta-segunda-cajas, rondas-frontera-norte-rio-blanco, rio-blanco-copper, autoridades-rio-blanco]
  issueIds: [concesion-superficie, consulta-participacion, certificacion-ambiental, agua-cuencas, fiscalizacion-ambiental, dialogo-acuerdos, competencias-estado]
  legalInstrumentIds: []
  minerals: [cobre, molibdeno]
  timeline:
    - id: rio-blanco-actas-2002
      kind: agreement
      date: 2002-07-09
      datePrecision: day
      title: Directivas suscriben documentos de autorización superficial
      summary: Representantes de Yanta y Segunda y Cajas suscribieron acuerdos con Minera Majaz; la Defensoría concluyó después que faltó el respaldo de dos tercios de las respectivas asambleas generales.
      sourceIds: [rio-blanco-defensoria-informe-2006]
    - id: rio-blanco-ea-2003
      kind: decision
      date: 2003-11-28
      datePrecision: day
      title: MINEM aprueba la Evaluación Ambiental de exploración
      summary: La RD 478-2003-EM/DGAA aprobó el instrumento de exploración presentado por Minera Majaz; una corrección posterior modificó la referencia distrital del proyecto.
      sourceIds: [rio-blanco-minem-ea-2003, rio-blanco-defensoria-informe-2006]
    - id: rio-blanco-conflicto-2004
      kind: event
      date: 2004-04-01
      datePrecision: month
      title: Comienza el conflicto registrado por la Defensoría
      summary: Los reportes defensoriales sitúan en abril de 2004 el inicio del conflicto por el rechazo de las comunidades a la exploración y por la controversia sobre territorio, ambiente y autorización.
      sourceIds: [rio-blanco-defensoria-reporte-36, defensoria-conflictos-268]
    - id: rio-blanco-enfrentamiento-2005
      kind: event
      date: 2005-08-01
      datePrecision: day
      title: Enfrentamiento durante la movilización hacia el campamento
      summary: La Defensoría registró un enfrentamiento con una persona fallecida, cinco heridas y treinta y dos detenidas, seguido por la conformación de una comisión de diálogo.
      sourceIds: [rio-blanco-defensoria-reporte-36]
    - id: rio-blanco-informe-defensoria-2006
      kind: decision
      date: 2006-11-14
      datePrecision: day
      title: Defensoría cuestiona el respaldo comunal
      summary: El Informe de Adjuntía concluyó que los acuerdos de 2002 carecían del respaldo de dos tercios de las asambleas y recomendó verificar el acuerdo previo sobre tierras superficiales antes de autorizar exploración.
      sourceIds: [rio-blanco-defensoria-informe-2006]
    - id: rio-blanco-consulta-2007
      kind: event
      date: 2007-09-16
      datePrecision: day
      title: Consulta vecinal expresa rechazo al proyecto
      summary: La consulta organizada en distritos de Ayabaca y Huancabamba expresó rechazo a la actividad minera asociada con Majaz/Río Blanco y se convirtió en un hito político territorial.
      sourceIds: [rio-blanco-defensoria-reporte-139, rio-blanco-iep-2009]
    - id: rio-blanco-sancion-2008
      kind: decision
      date: 2008-02-07
      datePrecision: day
      title: OSINERGMIN sanciona y ordena rehabilitación
      summary: La Resolución 444-2008-1-OS/GFM impuso una multa de 100 UIT por incumplimientos de exploración y dispuso presentar y ejecutar medidas de rehabilitación de los componentes intervenidos.
      sourceIds: [rio-blanco-osinergmin-444-2008]
    - id: rio-blanco-desistimiento-2009
      kind: decision
      date: 2009-01-01
      datePrecision: year
      title: MINEM acepta desistimiento del EIA-sd 2008-2010
      summary: La autoridad aceptó el desistimiento empresarial del nuevo programa de exploración; el conflicto y el proyecto continuaron abiertos.
      sourceIds: [rio-blanco-minem-desistimiento-2009]
    - id: rio-blanco-rehabilitacion-2016
      kind: decision
      date: 2016-01-01
      datePrecision: year
      title: MINEM aprueba modificación del plan de rehabilitación
      summary: La RD 274-2016-MEM/DGAAM aprobó una modificación de la actualización del plan de rehabilitación y mantuvo obligaciones sujetas a especificaciones y compromisos del expediente.
      sourceIds: [rio-blanco-minem-rehabilitacion-2016]
    - id: rio-blanco-rehabilitacion-2020
      kind: decision
      date: 2020-01-01
      datePrecision: year
      title: Segunda modificación del plan de rehabilitación
      summary: La RD 057-2020-MINEM/DGAAM aprobó una segunda modificación del instrumento; su existencia demuestra seguimiento administrativo, no culminación ambiental integral.
      sourceIds: [rio-blanco-minem-rehabilitacion-2020]
    - id: rio-blanco-reactivacion-2024
      kind: event
      date: 2024-08-19
      datePrecision: day
      title: Defensoría registra reactivación y ausencia de diálogo
      summary: Una notificación pública reunió demandas de comunidades y rondas y la Defensoría sostuvo una reunión territorial; el reporte clasificó el caso como reactivado, activo y sin diálogo.
      sourceIds: [rio-blanco-defensoria-reporte-246, rio-blanco-red-muqui-2024]
