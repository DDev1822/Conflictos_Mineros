  date: 2026-05-21
  title: Un año de despliegue estatal acumuló 2.520 patrullajes
  summary: El Ministerio de Defensa informó 67 acciones militares, 2.520 patrullajes integrados y una afectación económica calculada en S/249,8 millones desde mayo de 2025.
  analysis: Las cifras permiten medir la intensidad de la respuesta posterior a la masacre; deben leerse junto con resultados sostenidos sobre homicidios, transporte de mineral y control de explosivos.
