- id: research-tambogrande
  caseId: tambogrande
  depth: deep
  substantiveMilestoneTarget: 8
  cutoffDate: 2026-07-27
  currentStatusSummary: El ciclo Manhattan/TG-1 es histórico y concluyó su secuencia documentada con terminación de opción y desistimiento del EIA; El Algarrobo/TG-3 es un proceso contemporáneo distinto, adjudicado a Buenaventura, con contrato de opción firmado y conflicto socioambiental activo en el Reporte 268. Las fuentes revisadas no acreditan todavía un Acuerdo Marco Social concluido, ejecución hídrica, exploración ni operación.
  sourceIds: [manhattan-annual-report-2002, manhattan-centromin-2003, tambogrande-consulta-municipal, tambogrande-retiro-eia-2005, tambogrande-muradian-2003, cooperaccion-tambogrande-2024, proinversion-algarrobo-contrato-inicial-2024, proinversion-algarrobo-adjudicacion-2024, mef-algarrobo-contrato-2025, mef-ds-107-2025-ef, buenaventura-algarrobo-contrato-2025, defensoria-conflictos-268]
  directActorSourceIds: [manhattan-annual-report-2002, manhattan-centromin-2003, tambogrande-consulta-municipal, tambogrande-retiro-eia-2005, proinversion-algarrobo-contrato-inicial-2024, proinversion-algarrobo-adjudicacion-2024, mef-algarrobo-contrato-2025, buenaventura-algarrobo-contrato-2025]
  actorPositions:
    - actor: Organizaciones de Tambogrande y memoria territorial
      position: La consulta vecinal de 2002 se mantiene como un hito de decisión territorial y sectores de la sociedad civil conectan esa memoria con su oposición al proyecto contemporáneo.
      sourceIds: [tambogrande-consulta-municipal, cooperaccion-tambogrande-2024]
    - actor: Autoridad sectorial
      position: El procedimiento ambiental del proyecto histórico concluyó con la aceptación del desistimiento en 2005; este hecho no resuelve el estado del proyecto contemporáneo.
      sourceIds: [tambogrande-retiro-eia-2005, mef-algarrobo-contrato-2025]
    - actor: Manhattan Minerals
      position: La empresa defendió la viabilidad ambiental, económica y social del proyecto y discrepó con la terminación del acuerdo de opción comunicada por Centromin.
      sourceIds: [manhattan-annual-report-2002, manhattan-centromin-2003]
    - actor: PROINVERSIÓN, MEF y Activos Mineros
      position: El Estado presenta El Algarrobo como un proyecto de opción por etapas, con gestión social e infraestructura hídrica antes de exploración, y comunicó su adjudicación, firma contractual y garantías estatales.
      sourceIds: [proinversion-algarrobo-contrato-inicial-2024, proinversion-algarrobo-adjudicacion-2024, mef-algarrobo-contrato-2025, mef-ds-107-2025-ef]
    - actor: Compañía de Minas Buenaventura
      position: La empresa sostiene que priorizará agua y acuerdo social con Locuto antes de la exploración y presenta minería y agricultura como actividades compatibles; estas afirmaciones se conservan como posición corporativa.
      sourceIds: [buenaventura-algarrobo-contrato-2025]
    - actor: Comunidad Campesina Apóstol Juan Bautista de Locuto
      position: El contrato inicial la identifica como contraparte del Acuerdo Marco Social que condiciona la vigencia de la opción; las fuentes revisadas no permiten atribuir una posición uniforme a toda la comunidad ni afirmar que el acuerdo esté concluido.
      sourceIds: [proinversion-algarrobo-contrato-inicial-2024, mef-algarrobo-contrato-2025]
  contradictions:
    - id: tambogrande-legitimidad
      description: La legitimidad territorial expresada en la consulta de 2002 y el alcance administrativo del desistimiento de 2005 son planos distintos, y ninguno sustituye la evaluación documental del proceso El Algarrobo/TG-3.
      sourceIds: [tambogrande-consulta-municipal, tambogrande-retiro-eia-2005, proinversion-algarrobo-adjudicacion-2024]
      status: open
    - id: tambogrande-agua-primero
      description: El Estado y la empresa presentan una secuencia de agua y acuerdo social antes de exploración, mientras el Reporte 268 mantiene un conflicto socioambiental activo; falta evidencia pública que permita verificar por obligación el acuerdo, los estudios y la ejecución hídrica.
      sourceIds: [proinversion-algarrobo-contrato-inicial-2024, mef-algarrobo-contrato-2025, buenaventura-algarrobo-contrato-2025, defensoria-conflictos-268]
      status: open
    - id: tambogrande-representacion-territorial
      description: La identificación contractual de Locuto como contraparte y las posiciones de autoridades u organizaciones de Tambogrande no deben presentarse como una sola voluntad territorial ni como consenso distrital.
      sourceIds: [proinversion-algarrobo-contrato-inicial-2024, tambogrande-consulta-municipal, cooperaccion-tambogrande-2024]
      status: open
  scopeQuestions:
    - ¿Qué elementos territoriales y documentales pertenecen al ciclo Manhattan/TG-1 y cuáles corresponden exclusivamente a El Algarrobo/TG-3?
    - ¿Cuál es el texto final firmado del contrato de opción y qué diferencias presenta frente a la versión inicial de agosto de 2024?
    - ¿Existe un Acuerdo Marco Social suscrito con Locuto y qué compromisos, responsables, plazos, indicadores y mecanismos de rendición de cuentas contiene?
    - ¿Qué estudios de fuentes hídricas, expediente técnico, certificaciones y evidencia de ejecución existen al corte, diferenciando anuncios de resultados verificables?
    - ¿Cómo se distribuyen las posiciones entre Locuto, otras organizaciones de Tambogrande, autoridades, empresa y entidades estatales sin atribuir consenso?
  gaps:
    - id: tambogrande-expediente-historico
      description: La matriz integra fuentes empresariales, consulta municipal, estudio académico y resolución de desistimiento; falta el expediente administrativo completo del EIA histórico y del acuerdo de opción para reconstrucción documental, sin convertirlo en condición de publicación.
      blocksRelease: false
    - id: tambogrande-contrato-final
      description: Se revisó visualmente la versión inicial oficial del contrato y la comunicación oficial de firma; falta incorporar el texto final firmado para verificar cambios, anexos, montos y obligaciones definitivas.
      blocksRelease: false
    - id: tambogrande-acuerdo-agua
      description: No se localizó en las fuentes oficiales revisadas el Acuerdo Marco Social concluido ni una matriz pública de estudios, inversión y ejecución del componente hídrico; el expediente declara esta ausencia y evita afirmar cumplimiento.
      blocksRelease: false
  status: ready
- id: yanacocha-maxima-acuna-deep
  caseId: yanacocha-maxima-acuna
  depth: deep
  substantiveMilestoneTarget: 8
  cutoffDate: 2026-07-27
  currentStatusSummary: El expediente documenta la disputa territorial, la secuencia penal hasta la absolución definitiva, medidas de protección, el fallo constitucional sobre privacidad y el cierre procesal estadounidense; no adjudica propiedad ni presenta como cerrados los procesos civiles peruanos.
  sourceIds: [acuna-pj-casacion-458-2015, acuna-pj-nota-2017, acuna-tc-03882-04038-2016, acuna-defensoria-2015, acuna-cidh-mc-452-11, acuna-newmont-2017, acuna-newmont-2021, acuna-goldman-2016, acuna-scotus-21-33]
  directActorSourceIds: [acuna-newmont-2017, acuna-newmont-2021]
  actorPositions:
    - actor: Máxima Acuña y familia Chaupe
      position: La familia invocó documentos de posesión y compraventa, sostuvo su permanencia en Tragadero Grande y denunció afectaciones de tránsito, integridad y privacidad.
      sourceIds: [acuna-pj-casacion-458-2015, acuna-tc-03882-04038-2016, acuna-defensoria-2015]
    - actor: Minera Yanacocha y Newmont
      position: La empresa afirma haber adquirido el terreno, respeta la absolución penal, mantiene acciones civiles y declara disposición a un diálogo de buena fe.
      sourceIds: [acuna-newmont-2017, acuna-newmont-2021]
    - actor: Poder Judicial y Tribunal Constitucional
      position: La justicia penal confirmó la absolución y remitió la posesión a la vía civil; el TC protegió parcialmente la vida privada sin decidir propiedad o posesión.
      sourceIds: [acuna-pj-casacion-458-2015, acuna-tc-03882-04038-2016]
    - actor: Defensoría del Pueblo y CIDH
      position: Las instituciones activaron mecanismos de protección para la familia y otras personas defensoras del contexto Cajamarca, sin resolver el fondo civil de la disputa.
      sourceIds: [acuna-defensoria-2015, acuna-cidh-mc-452-11]
    - actor: Organizaciones ambientales
      position: El reconocimiento Goldman presenta a Máxima Acuña como defensora ambiental vinculada a la resistencia frente a Conga; se conserva como lectura social y no como conclusión judicial.
      sourceIds: [acuna-goldman-2016]
  contradictions:
    - id: acuna-penal-civil
      description: La absolución cerró la imputación penal por usurpación, pero no decidió la titularidad ni el mejor derecho de posesión sobre Tragadero Grande.
      sourceIds: [acuna-pj-casacion-458-2015, acuna-tc-03882-04038-2016]
      status: open
    - id: acuna-defensa-propiedad
      description: La familia presenta permanencia y defensa territorial, mientras Yanacocha afirma propiedad adquirida y ocupación; el paquete no contiene el expediente civil y registral completo para resolver ese desacuerdo.
      sourceIds: [acuna-pj-casacion-458-2015, acuna-newmont-2017]
      status: open
    - id: acuna-proteccion-seguridad
      description: Las medidas de protección y el fallo sobre privacidad coexisten con la posición empresarial de seguridad y defensa de propiedad, sin que una fuente individual cierre todos los hechos denunciados.
      sourceIds: [acuna-defensoria-2015, acuna-cidh-mc-452-11, acuna-tc-03882-04038-2016, acuna-newmont-2021]
      status: open
    - id: acuna-conga-autonomia
      description: El reconocimiento social conecta el caso con Conga, pero los expedientes judiciales revisados no prueban que Tragadero Grande explique por sí solo el estado general del proyecto.
      sourceIds: [acuna-goldman-2016, acuna-pj-casacion-458-2015, acuna-newmont-2017]
      status: open
  scopeQuestions:
    - ¿Cuál es el estado procesal completo de los procesos civiles de reivindicación e interdicto de retener mencionados por la empresa?
    - ¿Qué acreditan exactamente las partidas registrales, escrituras, mapas y peritajes catastrales de Tragadero Grande?
    - ¿Cómo se implementaron las medidas cautelares de la CIDH y qué seguimiento estatal documentado existe?
    - ¿Qué extremos de tránsito, privacidad y vigilancia quedaron fundados, improcedentes o fuera del habeas corpus?
    - ¿Cómo se conecta este conflicto con Conga sin fusionar expedientes ni afirmar una causalidad única?
  gaps:
    - id: acuna-expedientes-civiles
      description: No se incorporaron los expedientes civiles completos de reivindicación e interdicto de retener ni una decisión final posterior a 2021.
      blocksRelease: false
    - id: acuna-registro-catastro
      description: Faltan partidas registrales, escrituras, mapas y peritajes catastrales completos que permitan reconstruir la controversia predial.
      blocksRelease: false
    - id: acuna-proteccion-implementacion
      description: El paquete contiene la medida cautelar y la alerta defensorial, pero no el expediente completo de implementación y seguimiento.
      blocksRelease: false
    - id: acuna-seguridad-denuncias
      description: No se incorporaron denuncias fiscales y policiales completas ni convenios de seguridad aplicables a todos los episodios alegados.
      blocksRelease: false
  status: ready
- id: cerro-quilish-deep
  caseId: cerro-quilish
  depth: deep
  substantiveMilestoneTarget: 8
  cutoffDate: 2026-07-27
  currentStatusSummary: El expediente documenta la protección municipal, la sentencia constitucional, la autorización ambiental de 2004, la movilización social, la suspensión de eficacia y la revocatoria solicitada por Yanacocha; conserva como límites los documentos originales y estudios técnicos no localizados.
  sourceIds: [quilish-tc-00300-2002-aa-2003, quilish-tc-nota-2003, quilish-rm-467-2004-mem-dm, quilish-oefa-dfai-0274-2020, quilish-oefa-tfa-002-2021, quilish-sinia-indicadores-cajamarca, quilish-newmont-10k-2009, quilish-cnddhh-informe-2004]
  directActorSourceIds: [quilish-tc-00300-2002-aa-2003, quilish-rm-467-2004-mem-dm, quilish-newmont-10k-2009]
  actorPositions:
    - actor: Comunidades y población movilizada
      position: La reconstrucción regional atribuye a comunidades y población rural y urbana preocupación por cantidad y calidad del agua y oposición a la exploración; no se presenta esa posición como homogénea ni como conclusión hidrogeológica.
      sourceIds: [quilish-sinia-indicadores-cajamarca, quilish-cnddhh-informe-2004]
    - actor: Municipalidad Provincial de Cajamarca
      position: La municipalidad defendió la ordenanza como una medida local de conservación y protección del sistema hídrico, posición registrada en la sentencia constitucional.
      sourceIds: [quilish-tc-00300-2002-aa-2003]
    - actor: Minera Yanacocha y empresas recurrentes
      position: Las empresas cuestionaron la competencia municipal y alegaron afectación de derechos; posteriormente Yanacocha solicitó la revocatoria y Newmont atribuyó el retiro del permiso a la oposición local.
      sourceIds: [quilish-tc-00300-2002-aa-2003, quilish-rm-467-2004-mem-dm, quilish-newmont-10k-2009]
    - actor: Ministerio de Energía y Minas
      position: El MINEM autorizó la evaluación ambiental, dejó sin eficacia la decisión ante la necesidad de diálogo y finalmente revocó la autorización a pedido de la empresa.
      sourceIds: [quilish-rm-467-2004-mem-dm, quilish-oefa-tfa-002-2021]
    - actor: Tribunal Constitucional
      position: El TC declaró infundadas las demandas y delimitó el alcance de la ordenanza, la concesión, la exploración y una eventual explotación sujeta a evaluación ambiental y autorizaciones.
      sourceIds: [quilish-tc-00300-2002-aa-2003, quilish-tc-nota-2003]
  contradictions:
    - id: quilish-proteccion-competencia
      description: La protección municipal del agua coexistió con derechos concesionales previos; el fallo mantuvo la ordenanza sin convertirla en una prohibición absoluta de exploración.
      sourceIds: [quilish-tc-00300-2002-aa-2003, quilish-tc-nota-2003]
      status: open
    - id: quilish-autorizacion-legitimidad
      description: La RD 361 habilitó administrativamente la evaluación ambiental de exploración, pero la movilización y las decisiones posteriores muestran que la autorización no resolvió la legitimidad territorial.
      sourceIds: [quilish-rm-467-2004-mem-dm, quilish-sinia-indicadores-cajamarca]
      status: open
    - id: quilish-revocatoria-cierre
      description: La revocatoria dejó sin efecto la autorización específica y la empresa retiró el permiso, pero esos actos no prueban solución permanente de las controversias territoriales de Cajamarca.
      sourceIds: [quilish-rm-467-2004-mem-dm, quilish-newmont-10k-2009]
      status: open
  scopeQuestions:
    - ¿Qué fundamento técnico, cartográfico y competencial contiene el expediente original de la Ordenanza 012-2000-CMPC?
    - ¿Qué componentes, obligaciones, medidas ambientales y condiciones exactas establecieron las RD 361 y 427?
    - ¿Qué actores participaron en el diálogo propuesto y qué evidencia existe sobre sus resultados?
    - ¿Qué estudios hidrológicos e hidrogeológicos posteriores permiten contrastar las afirmaciones públicas sobre Quilish?
    - ¿Cómo se documenta la influencia territorial de Quilish sobre Conga sin fusionar expedientes administrativos distintos?
  gaps:
    - id: quilish-ordenanza-original
      description: La sentencia acredita existencia y alcance general de la Ordenanza 012-2000-CMPC, pero falta incorporar su texto oficial completo y el expediente municipal.
      blocksRelease: false
    - id: quilish-rd-originales
      description: La RM 467 y el TFA reproducen antecedentes y partes centrales de las RD 361 y 427, pero faltan los textos originales completos y sus anexos técnicos.
      blocksRelease: false
    - id: quilish-fuentes-comunitarias
      description: El memorial, las actas de movilización y las actas de diálogo se reconstruyen mediante un informe estatal regional; faltan originales y fuentes comunitarias directas representativas.
      blocksRelease: false
    - id: quilish-hidrogeologia
      description: El expediente documenta preocupaciones hídricas y la propuesta de estudio, pero no contiene una matriz comparada de estudios hidrogeológicos que permita resolver todas las afirmaciones técnicas.
      blocksRelease: false
  status: ready
