  sourceIds: [bcrp-memoria-2025-reinfo]

- id: pataz-secuestro-asesinato-2025
  topic: pataz
  date: 2025-05-04
  title: Trece trabajadores fueron secuestrados y asesinados en un socavón
  summary: Los trabajadores de seguridad de la empresa R&R habían sido secuestrados en abril y fueron encontrados muertos dentro del socavón Galindo, en Pataz.
  analysis: El crimen hizo visible que la disputa por zonas de extracción ya no podía tratarse únicamente como un problema minero o administrativo, sino como violencia organizada por el control del oro.
  metrics:
    - { value: "13", label: "trabajadores asesinados" }
    - { value: "39", label: "muertes vinculadas denunciadas por Poderosa desde 2022" }
