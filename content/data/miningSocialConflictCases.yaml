  location: "Distrito de Cáceres del Perú, provincia de Santa, departamento de Áncash."

- id: rcs-266-004
  snapshotId: defensoria-2026-04-mining
  title: "Desde el 29 de enero de 2026, la Comunidad Campesina Acsunche mantiene tomadas las instalaciones de la Minera Korimallko en Apurímac, exigiendo mejoras…"
  titleMethod: editorial-summary
  status: active
  conflictType: Socioambiental
  regionIds: [apurimac]
  sourcePage: 38
  hasMonthlyEvents: true
  startPeriod: 2026-02
  summary: "Desde el 29 de enero de 2026, la Comunidad Campesina Acsunche mantiene tomadas las instalaciones de la Minera Korimallko en Apurímac, exigiendo mejoras laborales e investigación por la muerte de ganado en la zona. La tensión se incrementó tras incidentes ambientales recientes y se investiga el presunto impacto en el entorno."
  location: "Comunidad Campesina de Acsunche y Virundo, distritos de Turpay y Virundo, provincia de Grau, departamento Apurímac."

- id: rcs-266-005
